services:
  edge:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Configure domínio com DNS apontado ao servidor}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.29.0.11
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
